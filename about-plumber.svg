<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066B3"/>
      <stop offset="100%" style="stop-color:#004A82"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E84C3D"/>
      <stop offset="100%" style="stop-color:#C0392B"/>
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F39C12"/>
      <stop offset="100%" style="stop-color:#E67E22"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect x="20" y="20" width="360" height="310" rx="20" fill="#E8F4FC"/>
  
  <!-- Pipes Network -->
  <g stroke="#0066B3" stroke-width="12" fill="none" stroke-linecap="round">
    <path d="M50 80 L150 80 L150 150 L250 150"/>
    <path d="M250 150 L250 80 L350 80"/>
    <path d="M150 150 L150 250 L80 250"/>
    <path d="M250 150 L250 250 L320 250"/>
  </g>
  
  <!-- Pipe Joints -->
  <circle cx="150" cy="80" r="15" fill="url(#orangeGrad)"/>
  <circle cx="150" cy="150" r="15" fill="url(#orangeGrad)"/>
  <circle cx="250" cy="150" r="15" fill="url(#orangeGrad)"/>
  <circle cx="250" cy="80" r="15" fill="url(#orangeGrad)"/>
  <circle cx="150" cy="250" r="15" fill="url(#orangeGrad)"/>
  <circle cx="250" cy="250" r="15" fill="url(#orangeGrad)"/>
  
  <!-- Valves -->
  <g transform="translate(190, 140)">
    <rect x="0" y="0" width="20" height="20" rx="3" fill="url(#yellowGrad)"/>
    <rect x="5" y="-15" width="10" height="15" fill="#666"/>
    <circle cx="10" cy="-15" r="8" fill="url(#orangeGrad)"/>
  </g>
  
  <!-- Wrench -->
  <g transform="translate(280, 180) rotate(-30)">
    <rect x="0" y="0" width="12" height="60" rx="2" fill="#777"/>
    <path d="M-4 -4 L16 -4 L16 10 L10 10 L10 5 L2 5 L2 10 L-4 10 Z" fill="#888"/>
  </g>
  
  <!-- Faucet -->
  <g transform="translate(60, 100)">
    <rect x="0" y="0" width="30" height="20" rx="5" fill="#888"/>
    <path d="M5 20 L5 50 Q5 60 15 60 Q25 60 25 50 L25 20" fill="#777"/>
    <ellipse cx="15" cy="65" rx="12" ry="8" fill="#0066B3" opacity="0.6"/>
  </g>
  
  <!-- Water Drops -->
  <g fill="#0066B3">
    <ellipse cx="75" cy="180" rx="6" ry="10" opacity="0.7"/>
    <ellipse cx="85" cy="200" rx="4" ry="7" opacity="0.5"/>
    <ellipse cx="70" cy="195" rx="3" ry="5" opacity="0.6"/>
    <ellipse cx="320" cy="280" rx="5" ry="8" opacity="0.7"/>
    <ellipse cx="330" cy="295" rx="3" ry="5" opacity="0.5"/>
  </g>
  
  <!-- Checkmark Badge -->
  <g transform="translate(300, 40)">
    <circle cx="30" cy="30" r="28" fill="url(#orangeGrad)"/>
    <path d="M18 30 L26 40 L45 20" stroke="white" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Tools -->
  <g transform="translate(40, 280)">
    <rect x="0" y="0" width="8" height="40" fill="#8B4513"/>
    <rect x="-5" y="35" width="18" height="15" rx="2" fill="#777"/>
  </g>
  
  <g transform="translate(340, 120)">
    <ellipse cx="15" cy="15" rx="15" ry="12" fill="url(#yellowGrad)"/>
    <rect x="10" y="25" width="10" height="25" fill="#777"/>
  </g>
</svg>
