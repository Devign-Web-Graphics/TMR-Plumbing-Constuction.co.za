<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 70">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066B3"/>
      <stop offset="100%" style="stop-color:#004A82"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E84C3D"/>
      <stop offset="100%" style="stop-color:#C0392B"/>
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F39C12"/>
      <stop offset="100%" style="stop-color:#E67E22"/>
    </linearGradient>
  </defs>
  
  <!-- Wrench Icon -->
  <g transform="translate(0, 8)">
    <rect x="8" y="20" width="40" height="8" rx="2" fill="#666" transform="rotate(-45, 28, 24)"/>
    <path d="M5 5 L15 15 L10 20 L0 10 Z" fill="url(#orangeGrad)"/>
    <path d="M45 45 L55 55 L50 60 L40 50 Z" fill="url(#orangeGrad)"/>
  </g>
  
  <!-- Plumber Character Mini -->
  <g transform="translate(45, 5)">
    <!-- Hard Hat -->
    <ellipse cx="20" cy="8" rx="18" ry="6" fill="url(#yellowGrad)"/>
    <path d="M5 8 Q5 2 20 0 Q35 2 35 8" fill="url(#yellowGrad)"/>
    <!-- Face -->
    <circle cx="20" cy="22" r="12" fill="#DEB887"/>
    <!-- Body -->
    <path d="M8 32 L8 55 L32 55 L32 32 Q20 28 8 32" fill="url(#blueGrad)"/>
    <!-- Arms -->
    <rect x="0" y="35" width="8" height="15" rx="3" fill="url(#orangeGrad)"/>
    <rect x="32" y="35" width="8" height="15" rx="3" fill="url(#orangeGrad)"/>
  </g>
  
  <!-- TMR Text - Bold style matching original -->
  <text x="95" y="32" font-family="Impact, Arial Black, sans-serif" font-size="28" font-weight="900" fill="url(#blueGrad)">TMR</text>
  
  <!-- PLUMBING Text -->
  <text x="150" y="32" font-family="Impact, Arial Black, sans-serif" font-size="28" font-weight="900" fill="url(#blueGrad)">PLUMBING</text>
  
  <!-- CONSTRUCTION Text -->
  <text x="95" y="55" font-family="Impact, Arial Black, sans-serif" font-size="22" font-weight="800" fill="url(#blueGrad)">CONSTRUCTION</text>
  
  <!-- Red accent line -->
  <rect x="95" y="60" width="180" height="3" fill="url(#orangeGrad)"/>
</svg>
