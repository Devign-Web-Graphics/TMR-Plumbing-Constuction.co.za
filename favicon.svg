<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066B3"/>
      <stop offset="100%" style="stop-color:#004A82"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E84C3D"/>
      <stop offset="100%" style="stop-color:#C0392B"/>
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F39C12"/>
      <stop offset="100%" style="stop-color:#E67E22"/>
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)"/>
  
  <!-- Plumber Character -->
  <g transform="translate(16, 8)">
    <!-- Hard Hat -->
    <ellipse cx="16" cy="8" rx="14" ry="5" fill="url(#yellowGrad)"/>
    <path d="M4 8 Q4 3 16 1 Q28 3 28 8" fill="url(#yellowGrad)"/>
    <!-- Face -->
    <circle cx="16" cy="18" r="10" fill="#DEB887"/>
    <!-- Eyes -->
    <circle cx="12" cy="16" r="2" fill="#333"/>
    <circle cx="20" cy="16" r="2" fill="#333"/>
    <!-- Smile -->
    <path d="M11 22 Q16 26 21 22" stroke="#333" stroke-width="1.5" fill="none"/>
    <!-- Body -->
    <path d="M6 27 L6 48 L26 48 L26 27 Q16 24 6 27" fill="url(#orangeGrad)"/>
    <!-- Arms -->
    <rect x="0" y="30" width="6" height="12" rx="2" fill="#DEB887"/>
    <rect x="26" y="30" width="6" height="12" rx="2" fill="#DEB887"/>
  </g>
</svg>
