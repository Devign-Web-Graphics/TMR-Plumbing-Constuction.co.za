<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066B3"/>
      <stop offset="100%" style="stop-color:#004A82"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E84C3D"/>
      <stop offset="100%" style="stop-color:#C0392B"/>
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F39C12"/>
      <stop offset="100%" style="stop-color:#E67E22"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DEB887"/>
      <stop offset="100%" style="stop-color:#CD853F"/>
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="200" cy="250" r="180" fill="#E8F4FC" opacity="0.5"/>
  
  <!-- Hard Hat -->
  <ellipse cx="200" cy="60" rx="70" ry="25" fill="url(#yellowGrad)"/>
  <path d="M130 60 Q130 30 200 25 Q270 30 270 60 L270 70 Q200 80 130 70 Z" fill="url(#yellowGrad)"/>
  <rect x="140" y="55" width="120" height="8" fill="#E67E22"/>
  
  <!-- Face -->
  <ellipse cx="200" cy="110" rx="50" ry="45" fill="url(#skinGrad)"/>
  
  <!-- Eyes -->
  <ellipse cx="180" cy="105" rx="8" ry="10" fill="white"/>
  <ellipse cx="220" cy="105" rx="8" ry="10" fill="white"/>
  <circle cx="182" cy="107" r="4" fill="#333"/>
  <circle cx="222" cy="107" r="4" fill="#333"/>
  
  <!-- Eyebrows -->
  <path d="M168 92 Q180 88 192 92" stroke="#5D4E37" stroke-width="3" fill="none"/>
  <path d="M208 92 Q220 88 232 92" stroke="#5D4E37" stroke-width="3" fill="none"/>
  
  <!-- Smile -->
  <path d="M180 130 Q200 145 220 130" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Mustache -->
  <path d="M175 122 Q190 130 200 125 Q210 130 225 122" fill="#5D4E37"/>
  
  <!-- Body - Overalls -->
  <path d="M120 160 Q120 180 140 200 L140 380 Q140 400 160 400 L240 400 Q260 400 260 380 L260 200 Q280 180 280 160 Q240 150 200 150 Q160 150 120 160 Z" fill="url(#blueGrad)"/>
  
  <!-- Overall Straps -->
  <rect x="150" y="160" width="25" height="80" fill="url(#blueGrad)"/>
  <rect x="225" y="160" width="25" height="80" fill="url(#blueGrad)"/>
  
  <!-- Buttons -->
  <circle cx="162" cy="245" r="8" fill="url(#yellowGrad)"/>
  <circle cx="238" cy="245" r="8" fill="url(#yellowGrad)"/>
  
  <!-- Pocket -->
  <rect x="175" y="280" width="50" height="40" rx="5" fill="#004A82" stroke="#0066B3" stroke-width="2"/>
  
  <!-- Arms -->
  <path d="M120 170 Q80 200 70 260 Q65 280 80 290 L120 270 Q130 230 140 200" fill="url(#skinGrad)"/>
  <path d="M280 170 Q320 200 330 260 Q335 280 320 290 L280 270 Q270 230 260 200" fill="url(#skinGrad)"/>
  
  <!-- Hands -->
  <ellipse cx="80" cy="285" rx="25" ry="20" fill="url(#skinGrad)"/>
  <ellipse cx="320" cy="285" rx="25" ry="20" fill="url(#skinGrad)"/>
  
  <!-- Gloves -->
  <ellipse cx="80" cy="285" rx="25" ry="20" fill="url(#orangeGrad)"/>
  <ellipse cx="320" cy="285" rx="25" ry="20" fill="url(#orangeGrad)"/>
  
  <!-- Wrench in Right Hand -->
  <g transform="translate(290, 240) rotate(45)">
    <rect x="0" y="0" width="15" height="80" rx="3" fill="#777"/>
    <path d="M-5 -5 L20 -5 L20 15 L12 15 L12 8 L3 8 L3 15 L-5 15 Z" fill="#888"/>
    <rect x="2" y="75" width="11" height="20" rx="2" fill="#666"/>
  </g>
  
  <!-- Plunger in Left Hand -->
  <g transform="translate(50, 260)">
    <rect x="15" y="0" width="8" height="70" fill="#8B4513"/>
    <ellipse cx="19" cy="75" rx="25" ry="15" fill="url(#orangeGrad)"/>
    <ellipse cx="19" cy="70" rx="20" ry="10" fill="#C0392B"/>
  </g>
  
  <!-- Legs -->
  <rect x="150" y="400" width="40" height="80" rx="5" fill="url(#blueGrad)"/>
  <rect x="210" y="400" width="40" height="80" rx="5" fill="url(#blueGrad)"/>
  
  <!-- Boots -->
  <path d="M145 470 L145 490 Q145 500 155 500 L200 500 Q210 500 210 490 L210 470 Z" fill="#333"/>
  <path d="M205 470 L205 490 Q205 500 215 500 L260 500 Q270 500 270 490 L270 470 Z" fill="#333"/>
  
  <!-- Tool Belt -->
  <rect x="130" y="370" width="140" height="20" rx="3" fill="#8B4513"/>
  <circle cx="160" cy="380" r="8" fill="url(#yellowGrad)"/>
  <circle cx="200" cy="380" r="8" fill="url(#yellowGrad)"/>
  <circle cx="240" cy="380" r="8" fill="url(#yellowGrad)"/>
  
  <!-- Water Splash Effects -->
  <g opacity="0.7">
    <ellipse cx="350" cy="180" rx="15" ry="20" fill="#0066B3"/>
    <ellipse cx="365" cy="220" rx="10" ry="15" fill="#0066B3"/>
    <ellipse cx="340" cy="250" rx="8" ry="12" fill="#0066B3"/>
    <ellipse cx="50" cy="180" rx="12" ry="18" fill="#0066B3"/>
    <ellipse cx="35" cy="210" rx="8" ry="12" fill="#0066B3"/>
  </g>
  
  <!-- Pipe behind plumber -->
  <g opacity="0.3">
    <rect x="30" y="350" width="340" height="25" rx="5" fill="#777"/>
    <rect x="80" y="340" width="25" height="45" rx="3" fill="#888"/>
    <rect x="280" y="340" width="25" height="45" rx="3" fill="#888"/>
  </g>
</svg>
